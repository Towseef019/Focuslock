name: Build FocusLock APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract Android project ZIP
        run: unzip -q FocusLock_GitHub_Upload.zip
      - name: Build debug APK
        working-directory: FocusLock
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-debug-apk
          path: FocusLock/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
